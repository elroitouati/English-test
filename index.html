<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כרטיסיות - אוצר מילים</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F3EC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="כרטיסיות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap" id="app"></main>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/countdown.js"></script>
<script src="js/flame-badge.js"></script>
<script src="js/plan.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').then((reg) => {
        reg.update();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update();
        });
      }).catch(() => {});
    });
    // כשגרסת service worker חדשה משתלטת, טוענים את הדף מחדש פעם אחת אוטומטית
    // כדי שתמיד יעבדו על הגרסה העדכנית בלי לסגור ולפתוח את האפליקציה ידנית.
    let reloadedForNewVersion = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloadedForNewVersion) return;
      reloadedForNewVersion = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
